<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smoobu Buchung</title>
  <style>
    html,body{margin:0;padding:0;background:transparent;overflow:hidden}
    body{font-family:Arial,sans-serif}
    #bookingTarget{width:100%}
    #bookingTarget iframe{
      display:block;
      width:100%!important;
      max-width:100%!important;
      border:0!important;
      background:#fff;
    }
    body.calendar-open #bookingTarget iframe{
      min-height:620px!important;
    }
    @media(max-width:760px){
      body.calendar-open #bookingTarget iframe{
        min-height:720px!important;
      }
    }
  </style>
</head>
<body>
  <div id="bookingTarget"></div>

  <script>
    const allowed=new Set(['3220877','3220882','3319157','3419581']);
    const params=new URLSearchParams(location.search);
    const property=params.get('property');

    if(!allowed.has(property)){
      document.body.textContent='Buchung konnte nicht geladen werden.';
      throw new Error('Invalid property');
    }

    const target=document.getElementById('bookingTarget');
    const mobile=window.matchMedia('(max-width:760px)').matches;

    // Smoobu provides a dedicated URL form for one individual property.
    // Use that on mobile so the booking form is rendered as a true single-
    // property flow instead of a one-item apartment-group search.
    const bookingUrl=mobile
      ? 'https://login.smoobu.com/de/booking-tool/iframe/1676062/'+property
      : 'https://login.smoobu.com/de/booking-tool/iframe/1676062?apartmentGroups[]='+property;

    const smoobuScript=document.createElement('script');
    smoobuScript.src='https://login.smoobu.com/js/Settings/BookingToolIframe.js';
    smoobuScript.onload=()=>{
      BookingToolIframe.initialize({
        url:bookingUrl,
        baseUrl:'https://login.smoobu.com',
        target:'#bookingTarget'
      });
      bindSmoobuFrame();
    };
    document.head.appendChild(smoobuScript);

    let lastSentHeight=0;
    const COMPACT_LIMIT=500;

    const getChildFrame=()=>target.querySelector('iframe');

    const sendHeight=(force=false)=>{
      requestAnimationFrame(()=>{
        const child=getChildFrame();
        const height=child
          ? Math.max(220,Math.ceil(child.getBoundingClientRect().height))
          : 220;

        const wasCompact=lastSentHeight>0 && lastSentHeight<COMPACT_LIMIT;
        const isCompact=height<COMPACT_LIMIT;

        if(!force && wasCompact && isCompact){
          return;
        }

        lastSentHeight=height;
        parent.postMessage({
          type:'smoobu-height',
          property,
          height
        }, location.origin);
      });
    };

    const bindSmoobuFrame=()=>{
      const child=getChildFrame();
      if(!child || child.dataset.bound==='true')return;
      child.dataset.bound='true';

      const syncFromSmoobu=()=>{
        const h=parseFloat(child.style.height)||parseFloat(child.getAttribute('height'))||0;
        if(h>0 && h<380){
          const wasOpen=document.body.classList.contains('calendar-open');
          document.body.classList.remove('calendar-open');
          sendHeight(wasOpen);
          return;
        }
        sendHeight();
      };

      new MutationObserver(syncFromSmoobu).observe(child,{
        attributes:true,
        attributeFilter:['style','height']
      });

      child.addEventListener('load',()=>{
        setTimeout(()=>sendHeight(true),80);
        setTimeout(()=>sendHeight(true),350);
      });

      sendHeight();
    };

    new MutationObserver(()=>{
      bindSmoobuFrame();
      sendHeight();
    }).observe(target,{childList:true,subtree:true});

    window.addEventListener('blur',()=>{
      setTimeout(()=>{
        if(document.activeElement===getChildFrame()){
          document.body.classList.add('calendar-open');
          sendHeight();
        }
      },0);
    });

    window.addEventListener('message',event=>{
      if(event.origin!==location.origin)return;
      if(event.data?.type==='smoobu-reset'){
        document.body.classList.remove('calendar-open');
        sendHeight(true);
      }
    });

    new ResizeObserver(sendHeight).observe(document.body);
    window.addEventListener('load',()=>sendHeight(true));
  </script>
</body>
</html>
